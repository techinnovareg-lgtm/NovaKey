name: Build NovaKey Android APK & Web Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Multiplatform NovaKey (Android APK & Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        working-directory: ./client
        run: flutter pub get

      - name: Run Quality Verification & Tests
        working-directory: ./client
        run: |
          flutter analyze
          flutter test

      - name: Build Android APK (Release)
        working-directory: ./client
        run: flutter build apk --release

      - name: Build Web Production
        working-directory: ./client
        run: flutter build web --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaKey-Android-Release-APK
          path: client/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NovaKey-Web-Release
          path: client/build/web
